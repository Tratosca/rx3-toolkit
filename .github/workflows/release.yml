# SPDX-License-Identifier: MPL-2.0

name: Release XDJ-RX3 Toolkit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-hook:
    name: Build ARM runtime assets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file

      - name: Compile firmware 1.19 stems hook
        run: make hook FIRMWARE=1.19

      - name: Upload ARM runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: runtime-assets-arm-hook
          path: build/librx3_core.so
          if-no-files-found: error

  toolkit:
    name: Build XDJ-RX3 Toolkit (${{ matrix.platform }})
    needs: arm-hook

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux x64
            artifact: xdj-rx3-toolkit-linux-x64
            target: dist/XDJ-RX3 Toolkit
            executable: dist/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-Linux-x64.tar.gz

          - runner: windows-2025
            platform: Windows x64
            artifact: xdj-rx3-toolkit-windows-x64
            target: dist/XDJ-RX3 Toolkit.exe
            executable: dist/XDJ-RX3 Toolkit.exe
            archive: XDJ-RX3-Toolkit-Windows-x64.zip

          - runner: macos-15-intel
            platform: macOS Intel
            artifact: xdj-rx3-toolkit-macos-intel
            target: dist/XDJ-RX3 Toolkit.app
            executable: dist/XDJ-RX3 Toolkit.app/Contents/MacOS/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-macOS-Intel.zip

          - runner: macos-latest
            platform: macOS Apple Silicon
            artifact: xdj-rx3-toolkit-macos-apple-silicon
            target: dist/XDJ-RX3 Toolkit.app
            executable: dist/XDJ-RX3 Toolkit.app/Contents/MacOS/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-macOS-Apple-Silicon.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download ARM runtime assets
        uses: actions/download-artifact@v4
        with:
          name: runtime-assets-arm-hook
          path: prebuilt

      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Test portable build engine
        run: python -m unittest discover -s tests -p test_mod_generator.py

      - name: Test separation engine
        run: python -m unittest discover -s tests -p test_stem_studio.py

      - name: Build desktop application
        env:
          RX3_PREBUILT_HOOK: ${{ github.workspace }}/prebuilt/librx3_core.so
        run: >
          pyinstaller
          --noconfirm
          --clean
          apps/rx3-toolbox/rx3_toolbox.spec

      - name: Check packaged macOS libraries
        if: runner.os == 'macOS'
        run: >
          python scripts/check_macos_bundle.py
          "${{ matrix.target }}"

      - name: Smoke-test packaged application
        run: >
          python scripts/smoke_desktop_app.py
          "${{ matrix.executable }}"

      - name: Package application
        run: >
          python scripts/package_release.py
          "${{ matrix.target }}"
          "release/${{ matrix.archive }}"
          --include LICENSE
          --include THIRD_PARTY_NOTICES.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish XDJ-RX3 Toolkit
    if: startsWith(github.ref, 'refs/tags/')
    needs: toolkit
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xdj-rx3-toolkit-*
          path: release
          merge-multiple: true

      - name: List release files
        run: |
          find release -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create
          "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --generate-notes
          --title "XDJ-RX3 Toolkit ${GITHUB_REF_NAME}"