# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        # FFmpeg is what the sidecar gain correction is measured against; the
        # tests covering it skip without one.
        run: sudo apt-get update && sudo apt-get install -y clang lld file ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and test sources
        run: make hook test preflight

  mod-generator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_mod_generator.py

  stem-studio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m unittest discover -s tests -p test_stem_studio.py
      - run: python apps/rx3-stem-studio/main.py --self-test
