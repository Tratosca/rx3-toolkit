# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and test sources
        run: make hook test preflight


  arm-hook:
    name: Build ARM runtime hook
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file

      - name: Compile the ARM hook
        run: make hook

      - name: Upload ARM runtime hook
        uses: actions/upload-artifact@v4
        with:
          name: runtime-assets-arm-hook
          path: build/librx3_core.so
          if-no-files-found: error


  desktop-app:
    name: Desktop app (${{ matrix.platform }})
    needs:
      - source
      - arm-hook

    strategy:
      fail-fast: false

      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux x64
            artifact: xdj-rx3-toolkit-linux-x64
            target: dist/XDJ-RX3 Toolkit
            executable: dist/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-Linux-x64.tar.gz

          - runner: windows-2025
            platform: Windows x64
            artifact: xdj-rx3-toolkit-windows-x64
            target: dist/XDJ-RX3 Toolkit.exe
            executable: dist/XDJ-RX3 Toolkit.exe
            archive: XDJ-RX3-Toolkit-Windows-x64.zip

          - runner: macos-15-intel
            platform: macOS Intel
            artifact: xdj-rx3-toolkit-macos-intel
            target: dist/XDJ-RX3 Toolkit.app
            executable: dist/XDJ-RX3 Toolkit.app/Contents/MacOS/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-macOS-Intel.zip

          - runner: macos-latest
            platform: macOS Apple Silicon
            artifact: xdj-rx3-toolkit-macos-apple-silicon
            target: dist/XDJ-RX3 Toolkit.app
            executable: dist/XDJ-RX3 Toolkit.app/Contents/MacOS/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-macOS-Apple-Silicon.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The window uses the system webview. It cannot be bundled, so the
          # machine that builds and the machine that runs both need it.
          sudo apt-get install -y clang lld file \
            gir1.2-webkit2-4.1 python3-gi libcairo2-dev libgirepository1.0-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Download ARM runtime hook
        uses: actions/download-artifact@v4
        with:
          name: runtime-assets-arm-hook
          path: prebuilt

      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Test portable build engine
        run: python -m unittest discover -s tests -p test_mod_generator.py

      - name: Test separation engine
        run: python -m unittest discover -s tests -p test_stems.py

      - name: Test the window's sources
        # This imports the webview backend. A backend that reaches for a display
        # at import time fails here rather than in front of an operator, and
        # none of these runners has a display server.
        run: python app/ui/shell.py --self-test

      - name: Build desktop application
        env:
          RX3_PREBUILT_HOOK: ${{ github.workspace }}/prebuilt/librx3_core.so
        run: pyinstaller --noconfirm --clean packaging/toolkit.spec

      - name: Check packaged macOS libraries
        if: runner.os == 'macOS'
        run: python scripts/check_macos_bundle.py "${{ matrix.target }}"

      - name: Smoke-test packaged application
        shell: bash
        timeout-minutes: 2
        run: |
          "${{ matrix.executable }}" --self-test

      - name: Package release
        run: >-
          python scripts/package_release.py
          "${{ matrix.target }}"
          "release/${{ matrix.archive }}"
          --include LICENSE
          --include THIRD_PARTY_NOTICES.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error


  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-app

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xdj-rx3-toolkit-*
          path: release
          merge-multiple: true

      - name: List release files
        run: |
          find release -maxdepth 1 -type f -print

      # The changelog is where the release is described in the first place, so
      # the published notes are that section rather than a second account of it.
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## $version" '
            $0 == want { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create
          "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --notes-file notes.md
          --title "XDJ-RX3 Toolkit ${GITHUB_REF_NAME}"