<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<meta charset="utf-8">
<title data-t="app.name"></title>
<link rel="stylesheet" href="app.css">

<aside id="rail">
  <header>
    <h1 data-t="app.name"></h1>
    <p class="dim" data-t="app.tagline"></p>
  </header>

  <nav role="tablist">
    <button role="tab" data-screen="drive" aria-selected="true">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="1.8" width="9" height="12.4" rx="2.2"/><path d="M6.5 4.6h3"/></svg></span>
      <span data-t="nav.drive"></span>
      <span class="tag" id="tag-drive" hidden></span>
    </button>
    <button role="tab" data-screen="modules" aria-selected="false">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1.3"/><rect x="9" y="2" width="5" height="5" rx="1.3"/><rect x="2" y="9" width="5" height="5" rx="1.3"/><rect x="9" y="9" width="5" height="5" rx="1.3"/></svg></span>
      <span data-t="nav.modules"></span>
    </button>
    <button role="tab" data-screen="samples" aria-selected="false">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="4" width="3" height="3.4" rx="1"/><rect x="6.3" y="4" width="3" height="3.4" rx="1"/><rect x="11.1" y="4" width="3" height="3.4" rx="1"/><rect x="1.5" y="8.8" width="3" height="3.4" rx="1"/><rect x="6.3" y="8.8" width="3" height="3.4" rx="1"/><rect x="11.1" y="8.8" width="3" height="3.4" rx="1"/></svg></span>
      <span data-t="nav.samples"></span>
      <span class="tag" id="tag-samples" hidden></span>
    </button>
    <button role="tab" data-screen="logo" aria-selected="false">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.8" y="3" width="12.4" height="10" rx="2.2"/><circle cx="5.8" cy="6.6" r="1.1"/><path d="M2.6 11.8l3.4-3.2 2.4 2.2 2.2-2 2.8 2.6"/></svg></span>
      <span data-t="nav.logo"></span>
    </button>
    <button role="tab" data-screen="stems" aria-selected="false">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6.2v3.6M6.3 3.4v9.2M9.7 5.2v5.6M13 4.2v7.6"/></svg></span>
      <span data-t="nav.stems"></span>
    </button>

    <span class="spacer"></span>

    <button role="tab" data-screen="settings" aria-selected="false">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 5.2h6.2M12.2 5.2H14M2 10.8h1.8M7.8 10.8H14"/><circle cx="10.2" cy="5.2" r="1.9"/><circle cx="5.8" cy="10.8" r="1.9"/></svg></span>
      <span data-t="nav.settings"></span>
    </button>
  </nav>
</aside>

<main>
  <!-- The drive ------------------------------------------------------------ -->
  <section id="drive" class="screen">
    <header>
      <h1 data-t="drive.title"></h1>
      <p class="lede" data-t="drive.lede"></p>
    </header>

    <div class="card">
      <div class="spread">
        <p class="path num" id="drive-path" data-t="drive.empty"></p>
        <button class="btn primary" id="drive-choose" data-t="drive.choose"></button>
      </div>
      <dl id="drive-summary" style="margin-top:20px" hidden></dl>
      <div class="row" id="drive-actions" style="margin-top:20px" hidden>
        <button class="btn small" id="drive-refresh" data-t="common.refresh"></button>
        <button class="btn small harm" id="drive-remove" data-t="drive.removeMod"></button>
      </div>
    </div>
  </section>

  <!-- Modules and the build ------------------------------------------------ -->
  <section id="modules" class="screen" hidden>
    <header>
      <h1 data-t="modules.title"></h1>
      <p class="lede" data-t="modules.lede"></p>
    </header>

    <div class="card">
      <div class="row">
        <label for="firmware" data-t="modules.firmware"></label>
        <select id="firmware"></select>
      </div>
      <ul id="module-list" class="stack" style="list-style:none;padding:0;margin:18px 0 0"></ul>
    </div>

    <div class="card">
      <h2 data-t="modules.key"></h2>
      <p class="lede" data-t="modules.keyLede"></p>
      <div class="row" style="margin-top:14px">
        <span class="path num" id="key-path"></span>
        <button class="btn small" id="key-choose" data-t="common.browse"></button>
      </div>
      <div class="row" style="margin-top:12px">
        <label data-t="modules.output"></label>
        <span class="path num" id="output-path"></span>
        <button class="btn small" id="output-choose" data-t="common.browse"></button>
      </div>
      <div class="row" style="margin-top:20px">
        <button class="btn primary" id="build" data-t="modules.build"></button>
        <span class="dim" id="build-note"></span>
      </div>
    </div>
  </section>

  <!-- The pads -------------------------------------------------------------- -->
  <section id="samples" class="screen" hidden>
    <header>
      <h1 data-t="samples.title"></h1>
      <p class="lede" data-t="samples.lede"></p>
    </header>

    <figure class="rx3-preview">
      <canvas class="rx3-mock" data-preview="samples" role="img" data-t-label="preview.label"></canvas>
      <figcaption data-t="preview.caption"></figcaption>
    </figure>

    <p class="card" id="samples-need-drive" data-t="samples.needDrive"></p>

    <div id="samples-editor" hidden>
      <div class="pad-layout">
        <div class="card">
          <div class="spread">
            <h2 data-t="samples.grid"></h2>
            <span class="dim num" id="bank-size"></span>
          </div>
          <p class="lede" data-t="samples.gridHint"></p>
          <div class="row" style="margin:12px 0">
            <label><input type="checkbox" id="samples-simulate"> <span data-t="samples.simulate"></span></label>
            <button class="btn small" id="samples-stop" data-t="samples.stopAll"></button>
          </div>
          <p class="dim" data-t="samples.simulateHint"></p>
          <div class="pad-grid" id="pad-grid"></div>
          <p class="dim" style="margin-top:14px" data-t="samples.onDeck"></p>
        </div>

        <div class="card" id="inspector"></div>
      </div>

      <div class="card">
        <div class="spread">
          <div>
            <h2 data-t="samples.bank"></h2>
            <p class="lede" data-t="samples.bankHint"></p>
          </div>
          <span class="pill" id="bank-state"></span>
        </div>

        <div class="row" style="margin-top:16px">
          <label for="bank-name" data-t="samples.bankName"></label>
          <input type="text" id="bank-name" maxlength="64" size="20">
          <select id="bank-pick"></select>
          <button class="btn small" id="bank-new" data-t="samples.newBank"></button>
          <button class="btn small harm" id="bank-delete" data-t="common.remove"></button>
        </div>

        <div class="row" style="margin-top:16px">
          <label for="bank-volume" data-t="samples.volume"></label>
          <input type="range" id="bank-volume" min="0" max="100" style="max-width:280px">
          <span class="num" id="bank-volume-value"></span>
        </div>

        <div class="row" style="margin-top:14px">
          <label class="row tight"><input type="checkbox" id="shift-silence">
            <span data-t="samples.shiftSilence"></span></label>
          <span class="pill" id="cap-shift"></span>
        </div>

        <div class="row" style="margin-top:20px">
          <button class="btn primary" id="bank-save" data-t="samples.save"></button>
          <button class="btn small" id="bank-activate" data-t="samples.makeActive"></button>
          <span class="dim" id="bank-note"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- The logo -------------------------------------------------------------- -->
  <section id="logo" class="screen" hidden>
    <header>
      <h1 data-t="logo.title"></h1>
      <p class="lede" data-t="logo.lede"></p>
    </header>

    <div class="logo-layout">
      <div class="card">
        <div class="spread">
          <h2 data-t="logo.preview"></h2>
          <button class="btn" id="logo-pick" data-t="logo.choose"></button>
        </div>

        <figure class="rx3-preview">
          <canvas id="logo-mock" class="rx3-mock" data-preview="logo" role="img" tabindex="0" data-t-label="preview.label"></canvas>
          <figcaption data-t="preview.caption"></figcaption>
        </figure>
        <canvas id="logo-canvas" hidden aria-hidden="true"></canvas>
        <p class="dim" data-t="logo.frameHint"></p>
      </div>

      <div class="card">
        <h2 data-t="logo.framing"></h2>

        <div style="margin-top:16px">
          <label for="logo-pane" data-t="logo.pane"></label>
          <select id="logo-pane" style="margin-left:10px"></select>
        </div>

        <div style="margin-top:18px">
          <label for="logo-zoom" data-t="logo.zoom"></label>
          <div class="row">
            <input type="range" id="logo-zoom" min="0" max="1000" value="0" style="max-width:220px">
            <span class="num" id="logo-zoom-value"></span>
          </div>
        </div>

        <div class="row tight" style="margin-top:18px">
          <button class="btn small" id="logo-fit" data-t="logo.fit"></button>
          <button class="btn small" id="logo-fill" data-t="logo.fill"></button>
          <button class="btn small quiet" id="logo-reset" data-t="logo.reset"></button>
        </div>

        <div class="row tight" style="margin-top:18px">
          <button class="btn small" id="logo-theme-dark" data-t="logo.themeDark"></button>
          <button class="btn small" id="logo-theme-light" data-t="logo.themeLight"></button>
        </div>

        <div class="stack" style="margin-top:18px" id="logo-notes"></div>

        <p class="dim" style="margin-top:18px" data-t="logo.buildHint"></p>
      </div>
    </div>
  </section>

  <!-- Separation ------------------------------------------------------------ -->
  <section id="stems" class="screen" hidden>
    <header>
      <h1 data-t="stems.title"></h1>
      <p class="lede" data-t="stems.lede"></p>
    </header>

    <div class="card">
      <div class="spread">
        <div>
          <h2 data-t="stems.machine"></h2>
          <p class="lede num" id="runtime-summary"></p>
        </div>
        <span class="pill" id="runtime-state"></span>
      </div>
      <div class="row" style="margin-top:14px">
        <label for="accelerator" data-t="stems.accelerator"></label>
        <select id="accelerator"></select>
        <button class="btn small" id="runtime-install" data-t="stems.install"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-t="stems.music"></h2>
      <p class="lede" data-t="stems.musicHint"></p>
      <div class="row" style="margin-top:14px">
        <button class="btn small" id="library-drive" data-t="stems.fromDrive"></button>
        <button class="btn small" id="library-file" data-t="stems.fromExport"></button>
        <span class="path num" id="library-path"></span>
      </div>
      <div class="row" style="margin-top:16px" id="playlist-row" hidden>
        <label for="playlist" data-t="stems.playlist"></label>
        <select id="playlist"></select>
        <span class="dim num" id="forecast"></span>
      </div>
    </div>

    <div class="card">
      <h2 data-t="stems.quality"></h2>
      <div class="modes" id="quality-row" style="margin-top:14px"></div>
      <p class="dim" id="quality-summary" style="margin-top:10px"></p>

      <div style="margin-top:20px">
        <label data-t="stems.parts"></label>
        <div class="row" id="roles-row" style="margin-top:8px"></div>
      </div>

      <div class="row" style="margin-top:18px">
        <label data-t="stems.writeTo"></label>
        <span class="path num" id="stems-output"></span>
        <button class="btn small" id="stems-output-choose" data-t="common.browse"></button>
      </div>

      <div class="row" style="margin-top:20px">
        <button class="btn primary" id="stems-start" data-t="stems.start"></button>
        <span class="dim" id="stems-note"></span>
      </div>
    </div>
  </section>

  <!-- Settings -------------------------------------------------------------- -->
  <section id="settings" class="screen" hidden>
    <header>
      <h1 data-t="settings.title"></h1>
    </header>
    <div class="card">
      <h2 data-t="settings.language"></h2>
      <p class="lede" data-t="settings.languageLede"></p>
      <div class="row tight" style="margin-top:14px" id="language-row">
        <button class="btn small" data-language="en" data-t="locale.en"></button>
        <button class="btn small" data-language="fr" data-t="locale.fr"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="settings.about"></h2>
      <p class="lede" data-t="settings.aboutLede"></p>
    </div>
  </section>

  <div id="job" hidden>
    <div class="spread">
      <p><strong id="job-message"></strong> <span class="dim num" id="job-detail"></span></p>
      <button class="btn small" id="job-cancel" data-t="job.cancel"></button>
    </div>
    <div id="job-bar"><span></span></div>
  </div>
</main>

<p id="failure" role="alert" hidden>
  <span id="failure-text"></span>
  <button class="btn small quiet" id="failure-close" data-t="common.dismiss"></button>
</p>

<script src="i18n.js"></script>
<script src="rx3-mock.js"></script>
<script src="samples.js"></script>
<script src="logo.js"></script>
<script src="stems-listen.js"></script>
  <script src="stems.js"></script>
<script src="app.js"></script>
