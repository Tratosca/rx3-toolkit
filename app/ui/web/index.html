  <button id="tasks-open" class="rail-context" aria-haspopup="dialog" aria-controls="tasks-dialog"><span data-t="tasks.title"></span> <span id="tasks-count" class="tag" hidden>1</span><small id="tasks-running" role="status" data-t="tasks.running" hidden></small></button>
  <button id="rail-drive" class="rail-context" data-go="drive" data-t="drive.empty"></button>
</aside>

<main>
  <!-- The drive ------------------------------------------------------------ -->
  <section id="drive" class="screen" role="region" aria-labelledby="drive-title">
    <header>
      <div>
      <h1 id="drive-title" tabindex="-1" data-t="drive.title"></h1>
          </div>
      <button class="btn primary" id="drive-choose" data-t="drive.choose"></button>
    </header>
    <div class="screen-body"><div class="screen-content">
      <div class="screen-state" role="status" hidden></div>
      <div class="card"><p class="dim" data-t="ui.destinationHelp"></p>
      <div class="spread">
        <p class="path num unset" id="drive-path" data-t="drive.empty"></p>

      </div>
      <dl id="drive-summary" style="margin-top:var(--s5)" hidden aria-live="polite"></dl>
      <div class="row" id="drive-actions" style="margin-top:var(--s5)" hidden>
        <button class="btn small" id="drive-refresh" data-t="common.refresh"></button>
        <button class="btn small harm" id="drive-remove" data-t="drive.removeMod"></button>
      </div>
    </div><section class="emergency-help"><h2 data-t="ui.restore"></h2><p class="dim" data-t="ui.restoreSteps"></p></section>
    </div></div>
  </section>

  <!-- Modules and the build ------------------------------------------------ -->
  <section id="modules" class="screen" role="tabpanel" aria-labelledby="tab-modules" hidden>
    <header>
      <div>
      <h1 data-t="modules.title"></h1>
      <p class="lede" data-t="modules.lede"></p>
          </div>
    </header>
    <div class="screen-body"><div class="screen-content">
      <div class="screen-state" role="status" hidden></div>

    <p id="modules-performance-tradeoff" class="notice" data-t="modules.performanceTradeoff" hidden></p>
    <div id="module-list" class="categories"></div>
    </div></div>
  </section>

  <!-- The pads -------------------------------------------------------------- -->
  <section id="samples" class="screen" role="tabpanel" aria-labelledby="tab-samples" hidden>
    <header>
      <div>
      <h1 data-t="samples.title"></h1>
      <p class="lede" data-t="samples.lede"></p>
          </div>
      <button class="btn primary" id="bank-save" disabled data-t="samples.save"></button>
    </header>
    <div class="screen-body"><div class="screen-content">
      <details class="screen-guide"><summary data-t="ui.onDeck"></summary><ol class="tutorial-steps"><li data-t="tutorial.sampleCreate"></li><li data-t="tutorial.sampleEdit"></li><li data-t="tutorial.sampleSave"></li></ol><p data-t="samples.onDeck"></p><figure class="rx3-preview"><canvas class="rx3-mock" data-preview="samples" role="img" data-t-label="preview.label"></canvas></figure></details>
      <div class="screen-state" role="status" hidden></div>

    <p id="samples-sync" class="notice" role="status" hidden></p>
    <button id="samples-local-retry" class="btn small" data-t="ui.retry" hidden></button>

    <div class="card empty-state" id="samples-need-drive">
      <p data-t="samples.needDrive"></p>
      <button class="btn primary" id="samples-choose-drive" data-t="drive.choose"></button>
    </div>




    <div id="samples-editor" hidden>
      <div class="card bank-settings">
        <div class="spread">
          <div>
            <h2 data-t="samples.bank"></h2>
            <p class="lede" data-t="samples.bankHint"></p>
          </div>
          <div class="row"><span class="pill" id="bank-state"></span><button class="btn small" id="bank-activate" data-t="samples.makeActive"></button></div>
        </div>

        <div class="row">
          <label for="bank-name" data-t="samples.bankName"></label>
          <input type="text" id="bank-name" maxlength="64" size="20">
          <select id="bank-pick" data-t-label="ui.bankPicker"></select>
          <button class="btn small" id="bank-new" data-t="samples.newBank"></button>
          <button class="btn small harm" id="bank-delete" data-t="common.remove"></button>
        </div>
        <p class="dim" id="bank-note"></p><p id="bank-active" role="status"></p><p class="dim" id="samples-module-note"></p><button class="btn quiet small" id="samples-modules" data-go="modules" data-t="ui.goModules"></button>
      </div>
      <div class="pad-layout">
        <div class="card">
          <div class="spread">
            <h2 data-t="samples.grid"></h2>
            <span class="dim num" id="bank-size"></span>
          </div>
          <p class="lede" data-t="samples.gridHint"></p>
          <div class="row" style="margin:var(--s3) 0">
            <input type="checkbox" id="samples-simulate" hidden><div class="segmented" role="group" data-t-label="samples.grid"><button class="btn" id="samples-edit" aria-pressed="true" data-t="ui.editPads"></button><button class="btn" id="samples-play" aria-pressed="false" data-t="ui.playPads"></button></div>
            <button class="btn small" id="samples-stop" data-t="samples.stopAll"></button>
          </div>
          <p class="dim" data-t="samples.simulateHint"></p>
          <div class="pad-grid" id="pad-grid" role="radiogroup" data-t-label="ui.padSelection"></div>


        </div>

        <div class="card" id="inspector"></div>
      </div><div class="bank-playback">        <div class="row" style="margin-top:var(--s4)">
          <label for="bank-volume" data-t="samples.volume"></label>
          <input type="range" id="bank-volume" min="0" max="100" style="max-width:var(--range-width)">
          <span class="num" id="bank-volume-value"></span>
        </div>        <div class="row" style="margin-top:var(--s4)">
          <label class="row tight"><input type="checkbox" id="shift-silence">
            <span data-t="samples.shiftSilence"></span></label>
          <span class="pill" id="cap-shift"></span>
        </div></div>


    </div>


    </div></div>
  </section>

  <!-- The logo -------------------------------------------------------------- -->
  <section id="logo" class="screen" role="tabpanel" aria-labelledby="tab-logo" hidden>
    <header>
      <div>
      <h1 data-t="logo.title"></h1>
      <p class="lede" data-t="logo.lede"></p>
          </div>
      <div class="row"><button class="btn primary" id="logo-pick" data-t="logo.choose"></button></div>
    </header>
    <div class="screen-body"><div class="screen-content">
      <details class="screen-guide"><summary data-t="ui.onDeck"></summary><ol class="tutorial-steps"><li data-t="tutorial.logoChoose"></li><li data-t="tutorial.logoFrame"></li><li data-t="tutorial.logoInstall"></li></ol></details>
      <div class="screen-state" role="status" hidden></div>

    <p id="logo-empty" class="empty-state" data-t="ui.logoEmpty"></p>
    <div class="logo-layout">
      <div class="card">
        <div class="spread">
          <h2 data-t="logo.preview"></h2>

        </div>

        <figure class="rx3-preview">
          <canvas id="logo-mock" class="rx3-mock" data-preview="logo" role="img" tabindex="0" data-t-label="preview.label"></canvas>
        </figure>
        <canvas id="logo-canvas" hidden aria-hidden="true"></canvas>
        <p class="dim" data-t="logo.frameHint"></p>
      </div>

      <fieldset class="card logo-controls" id="logo-controls" disabled>
        <h2 data-t="logo.framing"></h2>

        <div class="field" style="margin-top:var(--s4)">
          <span class="field-label" id="logo-pane-label" data-t="logo.pane"></span>
          <div class="segmented stretch" id="logo-pane" role="group" aria-labelledby="logo-pane-label"></div>
        </div>

        <div style="margin-top:var(--s5)">
          <label for="logo-zoom" data-t="logo.zoom"></label>
          <div class="row">
            <input type="range" id="logo-zoom" min="0" max="1000" value="0" style="max-width:var(--range-width)">
            <span class="num" id="logo-zoom-value"></span>
          </div>
        </div>

        <div class="row" style="margin-top:var(--s5)">
          <div class="segmented" role="group" data-t-label="logo.framing">
            <button class="btn small" id="logo-fit" aria-pressed="true" data-t="logo.fit"></button>
            <button class="btn small" id="logo-fill" aria-pressed="false" data-t="logo.fill"></button>
          </div>
          <button class="btn small quiet" id="logo-reset" data-t="logo.reset"></button>
        </div>

        <div class="field" style="margin-top:var(--s5)">
          <span class="field-label" id="logo-theme-label" data-t="logo.screenTheme"></span>
          <div class="segmented" role="group" aria-labelledby="logo-theme-label">
            <button class="btn small" id="logo-theme-dark" aria-pressed="true" data-t="logo.themeDark"></button>
            <button class="btn small" id="logo-theme-light" aria-pressed="false" data-t="logo.themeLight"></button>
          </div>
          <label class="switch-row" id="logo-invert-row">
            <input type="checkbox" role="switch" id="logo-invert" checked>
            <span>
              <strong data-t="logo.invert"></strong>
              <span class="dim" id="logo-invert-hint"></span>
            </span>
          </label>
        </div>

        <div class="stack" style="margin-top:var(--s5)" id="logo-notes"></div>


      </fieldset>
    </div>

    </div></div>
  </section>

  <!-- Separation ------------------------------------------------------------ -->
  <section id="stems" class="screen" role="tabpanel" aria-labelledby="tab-stems" hidden>
    <header>
      <div>
      <h1 data-t="stems.title"></h1>
      <p class="lede" data-t="stems.lede"></p>
          </div>
      <button class="btn primary" id="stems-start" disabled data-t="stems.start"></button>
    </header>
    <div class="screen-body"><div class="screen-content">
      <details class="screen-guide"><summary data-t="ui.onDeck"></summary><ol class="tutorial-steps"><li data-t="tutorial.stemSource"></li><li data-t="tutorial.stemPrepare"></li><li data-t="tutorial.stemPreview"></li></ol></details>
      <div class="screen-state" role="status" hidden></div>

    <div class="card">
      <h2 data-t="stems.music"></h2>
      <div class="notice" id="library-warning" role="alert" style="margin-top:var(--s4)" hidden>
        <p></p>
        <button class="btn small" type="button" id="library-recheck"></button>
      </div>
      <div class="row" style="margin-top:var(--s4)">
        <button class="btn small" id="library-drive" data-t="stems.fromDrive"></button>
        <button class="btn small" id="library-file" data-t="stems.fromExport"></button>
        </div>
      <p class="dim num" id="library-count"></p>
      <div class="row" style="margin-top:var(--s4)" id="playlist-row" hidden>
        <label for="playlist" data-t="stems.playlist"></label>
        <select id="playlist"></select>

      </div>
      <div class="memory" id="stems-memory"></div>
      <label class="switch-row" for="stems-overcue">
        <input type="checkbox" id="stems-overcue" aria-describedby="stems-overcue-help stems-overcue-storage stems-overcue-status">
        <span><strong data-t="stems.overcueLabel"></strong></span>
      </label>
      <p class="dim" id="stems-overcue-help" data-t="stems.overcueHelp"></p>
      <a class="module-meta linked" href="https://overcue.gg" target="_blank" rel="noopener noreferrer" data-t="stems.overcueLink"></a>
      <p class="dim num" id="stems-overcue-storage" role="status" aria-live="polite"></p>
      <p class="dim" id="stems-overcue-status"></p>
      <p class="notice" id="roles-warning" role="status" hidden></p>
      <p class="dim" id="stems-note"></p>
    </div>

    <div id="stems-track-picker" hidden>      <div class="row" style="margin-top:var(--s4)">
        <label for="stem-track" data-t="stems.importTrackLabel"></label>
        <select id="stem-track"></select>
      </div>
</div><div class="card" id="stems-listen" hidden></div>
    <section class="card" id="stems-runtime" aria-labelledby="runtime-title"><h2 id="runtime-title" data-t="ui.runtimeSettings"></h2><div class="runtime-content">
      <div class="spread">
        <div>
          <h2 data-t="stems.machine"></h2>
          <p class="lede" id="runtime-summary"></p>
        </div>
        <span class="pill" id="runtime-state"></span>
      </div>
      <button class="btn" id="runtime-install" data-t="stems.install"></button>
      <div class="runtime-settings">
        <div class="row"><label for="accelerator" data-t="stems.accelerator"></label><select id="accelerator"></select></div>
        <div class="row" id="stems-cache" style="margin-top:var(--s3)"></div>
      </div>
    </div></section>


    </div></div>
  </section>

  <!-- Settings -------------------------------------------------------------- -->
  <section id="settings" class="screen" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <header>
      <div>
      <h1 data-t="settings.title"></h1>
          </div>
    </header>
    <div class="screen-body"><div class="screen-content">
      <div class="screen-state" role="status" hidden></div>
    <div class="card settings-group">
      <div><h2 data-t="ui.appearance"></h2><p class="lede" data-t="ui.appearanceHint"></p></div>
      <div class="segmented" role="group" data-t-label="ui.appearance">
        <button class="btn" data-theme-choice="system" data-t="ui.themeSystem"></button>
        <button class="btn" data-theme-choice="light" data-t="ui.themeLight"></button>
        <button class="btn" data-theme-choice="dark" data-t="ui.themeDark"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="settings.language"></h2>
      <p class="lede" data-t="settings.languageLede"></p>
      <div class="segmented" style="margin-top:var(--s4)" id="language-row" role="group" data-t-label="settings.language">
        <button class="btn small" data-language="en" data-t="locale.en"></button>
        <button class="btn small" data-language="fr" data-t="locale.fr"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="settings.about"></h2>
      <p class="lede" data-t="settings.aboutLede"></p>
    </div>
      <p class="dim" data-t="ui.immediateSettings"></p>
    </div></div>
  </section>

    <dl id="installation-assets"></dl><p class="dim" data-t="install.assetsHint"></p>
    <div class="row"><button class="btn small" data-go="logo" data-t="nav.logo"></button><button class="btn small" data-go="samples" data-t="nav.samples"></button><button class="btn small" data-go="stems" data-t="nav.stems"></button></div>
        <div class="field">
          <span class="field-label" data-t="modules.output"></span>
          <span class="path num" id="output-path"></span><p class="dim" data-t="ui.destinationHelp"></p><p class="dim" id="output-mismatch" hidden></p>
          <div class="row tight">
            <button class="btn small" id="output-choose" data-t="ui.destinationChoose"></button>

<div class="row"><button class="btn small" data-go="drive" data-t="nav.drive"></button><button class="btn small" data-go="modules" data-t="nav.modules"></button><button class="btn small" data-go="installation" data-t="modules.build"></button></div>      </article>

          <p class="dim" id="key-note"></p>

            <span class="path num" id="key-path"></span>
            <div class="stack">
              <button class="btn small" id="key-choose" data-t="ui.keyChoose"></button>
              <button class="btn small" id="key-recover" data-t="modules.keyFetch"></button>
              <button class="btn small quiet" id="key-forget" data-t="modules.keyForget" hidden></button>
            </div>
          </details>
        </div>

    </details>
  </div>
  </div>
</section>
</main>


  <dialog id="tasks-dialog" aria-labelledby="tasks-title">
    <div class="spread"><h2 id="tasks-title" data-t="tasks.title"></h2><button class="btn small" id="tasks-close" data-t="common.close"></button></div>
    <p id="tasks-empty" class="dim" data-t="tasks.empty"></p>
    <div id="tasks-content"></div>
  </dialog>
  <span id="job-anchor" hidden></span>
  <div id="job" hidden data-state="idle">
    <div class="spread">
      <p><strong id="job-message" tabindex="-1" role="status" aria-live="polite"></strong> <span class="dim" id="job-detail"></span></p>
      <div class="row tight"><button class="btn small" id="job-cancel" data-t="job.cancel"></button><button class="btn small" id="job-close" data-t="common.close"></button></div>
    </div>
    <div class="row"><button class="btn small" id="job-retry" hidden data-t="ui.keyRetry"></button><button class="btn small" id="job-next" hidden></button></div>

  </div>

<div id="connection" role="status">
  <p id="connection-message" data-t="ui.connecting">Opening the app…</p>
  <button class="btn" id="connection-retry" data-t="ui.retry" hidden>Try again</button>
</div>

  <h2 id="confirmation-title"></h2>

  </div>
</dialog>

<!-- Shown before the key is fetched. The box unlocks only once the text has
     been scrolled to its end, and Python refuses a fetch without it. -->
<dialog id="terms" aria-labelledby="terms-title">
  <h2 id="terms-title" data-t="terms.title"></h2><p class="dim" data-t="ui.initialSetup"></p><div class="segmented" id="terms-language" role="group" data-t-label="settings.language"><button class="btn small" data-language="fr">Français</button><button class="btn small" data-language="en">English</button></div>
  <div id="terms-body" tabindex="0">
    <h3 data-t="ui.termsStorage"></h3><p data-t="terms.what"></p>
    <p data-t="terms.nothingElse"></p>
    <h3 data-t="ui.termsUse"></h3><p data-t="terms.purpose"></p>
    <p data-t="terms.owner"></p>
    <p data-t="terms.law"></p>
    <p data-t="terms.risk"></p>
    <h3 data-t="ui.termsRemove"></h3><p data-t="terms.remove"></p>
  </div>
  <p class="dim" id="terms-size"></p><p class="dim" id="terms-hint" data-t="terms.scroll"></p>
  <label class="row" id="terms-accept-row">
    <input type="checkbox" id="terms-accept" disabled>
    <span data-t="terms.accept"></span>
  </label>
  <div class="row" style="margin-top:var(--s4);justify-content:flex-end">
    <button class="btn small quiet" id="terms-cancel" data-t="ui.later"></button>
    <button class="btn small primary" id="terms-download" data-t="terms.download" disabled></button>
  </div>
</dialog>

<p id="failure" role="alert" hidden>
  <span id="failure-text" style="flex:1"></span>
  <button class="btn small quiet" id="failure-close" data-t="common.dismiss"></button>
</p>
